name: Supabase Keep-Alive Heartbeat

# This workflow prevents your Supabase free-tier project from pausing
# due to inactivity by writing to the heartbeat table every 2 days.

on:
  # Run automatically every 2 days at 3:00 AM UTC
  # (well within Supabase's 7-day inactivity pause window)
  schedule:
    - cron: '0 3 */2 * *'  # Every 2 days at 3:00 AM UTC
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  heartbeat:
    name: Send Heartbeat to Supabase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv
      
      - name: Run heartbeat script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/supabase_heartbeat.py
      
      - name: Report status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Heartbeat completed successfully"
          else
            echo "❌ Heartbeat failed - check logs above"
            exit 1
          fi
